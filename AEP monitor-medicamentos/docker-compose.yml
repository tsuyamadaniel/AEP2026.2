services:
  mongo:
    image: mongo:7
    container_name: mongo-monitor
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=monitor_medicamentos
    volumes:
      - mongo-data:/data/db
      - ./mongo-init/init.js:/docker-entrypoint-initdb.d/init.js:ro
volumes:
  mongo-data:
